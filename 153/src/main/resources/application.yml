server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: liquor-brewing-management

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/liquor_management?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root123

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.liquor.brewing.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: liquor-brewing-management-secret-key-2024
  expiration: 86400000
  header: Authorization
  prefix: Bearer

liquor:
  schedule:
    enable: true
  batch-code-prefix: LQ
  warn-expire-days: 30
  auto-freeze-days: 7
  reservation-expire-hours: 24
  cost:
    equipment-base: 500
    utility-base: 300
    labor-base: 800
