server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: snack-processing
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/snack_processing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 20
          max-wait: -1
          max-idle: 10
          min-idle: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  task:
    scheduling:
      pool:
        size: 10

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.snack.processing.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: snack-processing-secret-key-2024-abcdefghijklmnopqrstuvwxyz
  expiration: 86400000
  token-prefix: Bearer
  header: Authorization

logging:
  level:
    com.snack.processing: debug
    org.springframework.security: info
