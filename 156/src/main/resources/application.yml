server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: fire-equipment-management
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/fire_equipment_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  mail:
    host: smtp.example.com
    port: 587
    username: admin@example.com
    password: password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.firecontrol.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: fire-control-equipment-management-secret-key-2024
  expiration: 86400000
  header: Authorization
  prefix: Bearer

knife4j:
  enable: true
  openapi:
    title: 消防器材生产管控系统API文档
    description: 工业民用消防器材生产管控后端服务接口文档
    email: admin@firecontrol.com
    concat: 技术支持
    version: 1.0.0
    terms-of-service-url: http://www.firecontrol.com
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.firecontrol.controller
